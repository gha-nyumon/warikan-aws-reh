name: rollback

# 画面のボタンから、環境と戻す先のバージョンを選んで、エイリアスを付け替える（数秒で戻る）
# 戻したあとは、main に残っている問題のコードを直す PR を出すこと
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "戻す環境"
        type: choice
        options: [dev, prod]
      version:
        description: "戻す先の Lambda のバージョン（番号）"
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }} # prod は承認が必要
    concurrency:
      group: deploy-${{ inputs.environment }} # デプロイと同じグループ（同時に動かさない）
      cancel-in-progress: false
    env:
      FUNCTION_NAME: ${{ vars.FUNCTION_NAME }}
      FUNCTION_ALIAS: ${{ vars.FUNCTION_ALIAS }}
      API_URL: ${{ vars.API_URL }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: 入力を確かめる
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+$ ]]; then echo "::error::バージョンは数字で入力してください"; exit 1; fi

      - name: AWS のロールを借りる（OIDC）
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: gha-${{ github.run_id }}-rollback-${{ inputs.environment }}
          role-duration-seconds: 900

      - name: エイリアスを指定のバージョンに向け直す
        run: |
          BEFORE=$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name "$FUNCTION_ALIAS" \
            --query FunctionVersion --output text)
          aws lambda update-alias --function-name "$FUNCTION_NAME" --name "$FUNCTION_ALIAS" \
            --function-version "$VERSION" --routing-config '{"AdditionalVersionWeights":{}}' \
            --query FunctionVersion --output text
          echo "### ${{ inputs.environment }} を $BEFORE から $VERSION に戻しました" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=ロールバック::${{ inputs.environment }} を $BEFORE から $VERSION に戻しました"

      - name: スモークテスト
        run: |
          curl -fsS "$API_URL?total=9000&people=3" | tee api.json
          echo
          grep -q '"member": 3000' api.json
          grep -q "\"version\": \"$VERSION\"" api.json
