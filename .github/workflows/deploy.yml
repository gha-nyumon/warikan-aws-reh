name: deploy

# main に入った変更を、テスト → dev（自動）→ prod（承認してから）の順に届ける
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "infra/**"
      - "bootstrap/**"
  workflow_dispatch:

permissions:
  id-token: write # OIDC のトークンをもらう（呼び出す _deploy.yml でも使う）
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: テストを実行する（pytest）
        run: pytest

  deploy-dev:
    needs: test
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev

  deploy-prod:
    needs: deploy-dev
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
