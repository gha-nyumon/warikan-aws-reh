name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチの古い実行は取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7

      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 道具をインストールする
        run: pip install -r requirements-dev.txt

      - name: 書き方をチェックする（ruff）
        run: |
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7

      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 道具をインストールする
        run: pip install -r requirements-dev.txt

      - name: テストを実行する（pytest）
        run: pytest
