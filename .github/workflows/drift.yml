name: drift

# 毎日決まった時刻に plan を作り、手作業の変更（ドリフト）が無いかを確かめる
# 差分があればワークフローを失敗にして、通知で気づけるようにする。直すかどうかは人が判断する
on:
  schedule:
    - cron: "0 0 * * *" # 毎日 0:00（世界の標準の時刻）＝ 日本の時刻の 9:00
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: gha-${{ github.run_id }}-drift
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - name: plan でドリフトを確かめる
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -lock-timeout=5m > plan.txt
          CODE=$?
          set -e
          cat plan.txt
          if [ "$CODE" = "2" ]; then
            {
              echo "### ⚠ ドリフトが見つかりました（コードと AWS の実際が食い違っています）"
              echo "手作業の変更を残すならコードに取り込む PR を、要らないなら apply で元に戻してください。"
              echo '```'
              grep -E '^\s*[~+-]|^Plan:' plan.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit "$CODE"
